# Aye3: a plain grey launcher.
# Reference: man fuzzel.ini. Colors are RRGGBBAA.
[main]
font=sans:size=12
terminal=foot
icon-theme=Numix
prompt="> "
width=40
lines=12
# Close when another window gets the keyboard (a click on it), not only on Esc.
keyboard-focus=on-demand

[colors]
background=222222ff
text=bbbbbbff
prompt=eeeeeeff
input=eeeeeeff
match=2e9ef4ff
selection=285577ff
selection-text=ffffffff
selection-match=ffffffff
border=4c7899ff

[border]
width=2
radius=8
