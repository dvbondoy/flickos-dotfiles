# Seven: a light launcher.
# Reference: man fuzzel.ini. Colors are RRGGBBAA.
[main]
font=sans:size=12
terminal=foot
icon-theme=Numix
prompt="> "
width=40
lines=12
# Close when another window gets the keyboard (a click on it), not only on Esc.
keyboard-focus=on-demand

[colors]
background=ffffffee
text=1e1e1eff
prompt=1f5fa8ff
input=1e1e1eff
match=1f5fa8ff
selection=cce4fbff
selection-text=000000ff
selection-match=1f5fa8ff
border=8cbdf0ff

[border]
width=2
radius=8
